server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: setup-back
  datasource:
    # Banco do docker-compose.yml (porta 5433). Pode sobrescrever com variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/setassembler}
    username: ${DB_USER:setassembler}
    password: ${DB_PASSWORD:setassembler}
  jpa:
    open-in-view: false
    hibernate:
      # Quem cria/altera tabelas é o Flyway (src/main/resources/db/migration).
      # O Hibernate só confere se as entidades batem com o banco.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Chave em Base64 (mínimo 256 bits). Em produção, defina JWT_SECRET com outro valor.
    secret: ${JWT_SECRET:c2V0LWFzc2VtYmxlci1jaGF2ZS1kZS1kZXNlbnZvbHZpbWVudG8tdHJvcXVlLWVtLXByb2R1Y2Fv}
    expiracao-horas: 8
  cors:
    # Padrões aceitos para o front em desenvolvimento (qualquer porta do próprio PC).
    origens: http://localhost:*,http://127.0.0.1:*
  admin:
    # Conta de administrador criada na primeira execução (caso de uso "Manter Componentes").
    nome: Administrador
    email: ${ADMIN_EMAIL:admin@setassembler.local}
    senha: ${ADMIN_SENHA:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
